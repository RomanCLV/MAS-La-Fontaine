<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tests des calculs · Recueil Alimentation</title>
<style>
body{font-family:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;margin:24px;color:#1c1c1c;background:#f3f1ec}
h1{font-size:22px;margin:0 0 4px}
#resume{font-size:18px;font-weight:700;padding:8px 12px;border-radius:6px;display:inline-block;margin:8px 0 16px}
.ok{background:#e3f2e1;color:#1b5e20}.ko{background:#fbe3e3;color:#8a1c1c}
section{background:#fff;border:1px solid #888;border-radius:8px;padding:10px 14px;margin-bottom:10px}
h2{font-size:16px;margin:0 0 6px}
li{font-size:14px;line-height:1.6}
li.ko{list-style:'✗  '}li.ok{list-style:'✓  ';background:none;color:#1b5e20}
</style>
</head>
<body>
<h1>Tests des calculs</h1>
<div>Ouvrir ce fichier dans le navigateur : tous les tests doivent être verts.</div>
<div id="resume"></div>
<div id="sortie"></div>

<script src="js/data/modele.js"></script>
<script src="js/calc/calc.js"></script>
<script src="js/ui/outils.js"></script>
<script src="js/ui/selection-nombres.js"></script>
<script src="js/ui/historique.js"></script>
<script src="js/aide/contenu.js"></script>
<script src="js/aide/nouveautes.js"></script>
<script src="js/aide/illustrations.js"></script>
<script>
(function () {
  'use strict';
  var M = Recueil.Modele, C = Recueil.Calc;
  var nbOk = 0, nbKo = 0, liste = null;
  var sortie = document.getElementById('sortie');

  function groupe(titre, fn) {
    var s = document.createElement('section');
    var h = document.createElement('h2'); h.textContent = titre; s.appendChild(h);
    liste = document.createElement('ul'); s.appendChild(liste);
    sortie.appendChild(s);
    try { fn(); } catch (e) { note(false, 'Erreur : ' + e.message); }
  }
  function note(ok, texte) {
    var li = document.createElement('li'); li.className = ok ? 'ok' : 'ko'; li.textContent = texte;
    liste.appendChild(li);
    if (ok) nbOk++; else nbKo++;
  }
  function egal(obtenu, attendu, texte) {
    var ok = JSON.stringify(obtenu) === JSON.stringify(attendu);
    note(ok, texte + (ok ? ' (' + JSON.stringify(obtenu) + ')' : ' : obtenu ' + JSON.stringify(obtenu) + ', attendu ' + JSON.stringify(attendu)));
  }
  function col(f, id) { return f.colonnes.filter(function (c) { return c.id === id; })[0]; }

  // Jeu d'essai minimal : 2 parcs, référentiel réduit.
  function jeu() {
    return M.migrer({
      app: M.APP, version: 1,
      referentiels: {
        parcs: [{ id: 'p1', nom: 'Parc 1', couleur: '#fff', ordre: 1 }, { id: 'p2', nom: 'Parc 2', couleur: '#fff', ordre: 2 }],
        regimes: [
          { id: 'normal', nom: 'Normal', nature: 'texture' }, { id: 'hache', nom: 'Haché', nature: 'texture' },
          { id: 'mixe', nom: 'Mixé', nature: 'texture' },
          { id: 'sans_porc', nom: 'Sans porc', nature: 'regime' }, { id: 'sans_viande', nom: 'Sans viande', nature: 'regime' },
          { id: 'diabetique', nom: 'Diabétique', nature: 'regime' },
          { id: 'double_plat', nom: 'Double plat', nature: 'option', affecte: 'plat' },
          { id: 'double_legumes_vert', nom: 'Double légumes', nature: 'option', affecte: 'legumes' },
          { id: 'enrichi', nom: 'Enrichi', nature: 'option' }
        ]
      },
      residents: [
        { id: 'A', nom: 'A', parcId: 'p1', textureId: 'normal' },
        { id: 'B', nom: 'B', parcId: 'p1', textureId: 'hache', regimeIds: ['diabetique'], optionIds: ['double_plat', 'enrichi'] },
        { id: 'C', nom: 'C', parcId: 'p1', textureId: 'normal', regimeIds: ['sans_porc'] },
        { id: 'D', nom: 'D', parcId: 'p2', textureId: 'mixe', optionIds: ['double_legumes_vert'] },
        { id: 'E', nom: 'E', parcId: 'p2', textureId: 'normal', archive: true }
      ],
      semaines: [{ id: '2026-S42', debut: '2026-10-12',
        salaries: { p1: { lun_midi: { standard: 2, sansPorc: 1 } } },
        sodexo: { lun_midi: { standard: 4, sansPorc: 0 } },
        direction: { lun_midi: 3 }, nettoyageSansViande: { lun_midi: 5 }, temoins: { lun_midi: 2 } }]
    });
  }

  groupe('Dates et créneaux', function () {
    M.appliquerServices(null);
    egal(M.creneaux(M.semaineVide('2026-10-12')).length, 21, '21 créneaux par semaine (petit déjeuner, midi, soir)');
    egal(M.creneaux(M.semaineVide('2026-10-12')).slice(0, 3), ['lun_petitdej', 'lun_midi', 'lun_soir'], 'Ordre des services : petit déjeuner, midi, soir');
    egal(M.idSemaine('2026-10-12'), '2026-S42', 'Semaine ISO du 12/10/2026');
    egal(M.idSemaine('2027-01-01'), '2026-S53', '1er janvier 2027 = semaine 53 de 2026');
    egal(M.lundiDe('2026-10-18'), '2026-10-12', 'Lundi de la semaine du dimanche 18/10');
    egal(M.dateDuCreneau({ debut: '2026-10-12' }, 'jeu_midi'), '2026-10-15', 'Date du jeudi midi');
    egal(M.ajouterJours('2026-10-24', 2), '2026-10-26', 'Passage à l\'heure d\'hiver sans décalage');
  });

  groupe('Totaux par zone', function () {
    var d = jeu(), s = d.semaines[0];
    var f = C.feuilleJour(d, s, 'lun_midi');
    var p1 = col(f, 'p1').c, p2 = col(f, 'p2').c;
    egal([p1.residents, p1.platsEnPlus, p1.salStd, p1.salSansPorc, p1.total], [3, 1, 2, 1, 7], 'Parc 1 : 3 résidents + 1 double + 2 std + 1 sans porc = 7');
    egal(p2.total, 1, 'Parc 2 : résident archivé non compté');
    egal(col(f, 'totalParcs').c.total, 8, 'Total parcs = 7 + 1');
    egal(col(f, 'sodexo').c.total, 4, 'Sodexo 4 standard');
    egal(col(f, 'direction').c.total, 3, 'Direction 3');
    egal(col(f, 'nettoyage').c.total, 5, 'Nettoyage 5 (zone Autres)');
    egal(col(f, 'temoins').c.total, 2, 'Plats témoins 2');
    egal(f.total.total, 22, 'Total à produire = 8 + 4 + 3 + 5 + 2');
    egal(C.feuilleJour(d, s, 'lun_soir').total.total, 5, 'Lundi soir : résidents seulement (4 + 1 double)');
  });

  groupe('Double plat', function () {
    var d = jeu(), f = C.feuilleJour(d, d.semaines[0], 'lun_soir');
    var p1 = col(f, 'p1').c;
    egal(p1.tex.hache, 2, 'Haché avec double plat = 2 plats hachés');
    egal(p1.reg.diabetique, 2, 'Régime diabétique compté sur les 2 plats');
    egal(p1.opt.double_plat, 1, 'Ligne double plat = 1 personne');
    egal(p1.opt.enrichi, 2, 'Enrichi compté sur les 2 plats');
    egal(col(f, 'p2').c.opt.double_legumes_vert, 1, 'Double légumes (D, un seul plat) = 1');
    var t = f.total;
    egal((t.tex.normal || 0) + (t.tex.hache || 0) + (t.tex.mixe || 0), t.total, 'Normal + Haché + Mixé = total');
  });

  groupe('Plusieurs options « +1 plat »', function () {
    var d = jeu(), s = d.semaines[0];
    d.referentiels.regimes.push({ id: 'gros', nom: 'Gros gourmand', nature: 'option', affecte: 'plat' });
    d.residents[1].optionIds.push('gros');
    var refs = M.refs(d);
    egal(C.poids(d.residents[1], refs, 'midi'), 3, 'Double plat + gros gourmand = 3 plats');
    egal(C.poids(d.residents[1], refs, 'petitdej'), 1, 'Petit déjeuner : toujours 1');
    var f = C.feuilleJour(d, s, 'lun_midi'), p1 = col(f, 'p1').c;
    egal([p1.platsEnPlus, p1.total], [2, 8], 'Parc 1 : 2 plats en plus, total 8');
    egal(p1.tex.hache, 3, 'Haché compté sur les 3 plats');
    var ch = C.chariot(d, s, 'lun_midi', col(f, 'p1'));
    egal(ch.etiquettes[0].eq, 3, 'Étiquette de B : EQ 3');
    egal([ch.doubles, ch.platsEnPlus], [[{ nom: 'B', n: 2 }], 2], 'Chariot : 2 plats chauds en plus pour B');
  });

  groupe('Activité retirée du parc', function () {
    var d = jeu(), s = d.semaines[0];
    s.activites.push({ id: 'act', nom: 'Sport', jour: 'lun', service: 'midi', participantIds: ['B', 'D'], presetId: null });
    var f = C.feuilleJour(d, s, 'lun_midi');
    egal(col(f, 'p1').c.residents, 2, 'B retiré du parc 1');
    egal(col(f, 'p1').c.platsEnPlus, 0, 'Son double plat part avec lui');
    egal(col(f, 'p1').partis.length, 1, 'Parc 1 : 1 résident parti en activité');
    egal([col(f, 'p1').platsPartis, col(f, 'p2').platsPartis], [2, 1], 'Plats retirés des parcs : B (double plat) = 2, D = 1');
    egal(col(f, 'act').c.total, 3, 'Colonne Sport = B (2 plats) + D');
    egal(col(f, 'act').c.tex.hache, 2, 'La texture suit le résident');
    egal(col(f, 'totalParcs').c.total, 8, 'Total parcs inchangé');
    egal(f.total.total, 22, 'Total à produire inchangé (pas de double compte)');
    egal(C.chariot(d, s, 'lun_midi', col(f, 'act')).etiquettes.map(function (e) { return e.nom + ' ' + e.parc.id; }),
      ['B p1', 'D p2'], 'Chariot d’activité : étiquettes avec le parc de chaque résident');
    egal(col(C.feuilleJour(d, s, 'lun_soir'), 'act'), undefined, 'Pas de colonne Sport le soir');
    s.presences.B = { lun_midi: 0 };
    egal(C.feuilleJour(d, s, 'lun_midi').total.total, 20, 'Participant absent : compté nulle part');
  });

  groupe('Direction et nettoyage', function () {
    var d = jeu(), f = C.feuilleJour(d, d.semaines[0], 'lun_midi');
    egal(col(f, 'nettoyage').c.reg.sans_viande, 5, 'Nettoyage = 5 sans viande');
    egal(col(f, 'nettoyage').c.salStd, 5, 'Nettoyage en ligne salariés standard');
    var d2 = M.migrer({ app: M.APP, version: M.VERSION, referentiels: d.referentiels,
      semaines: [{ debut: '2026-10-12', nettoyage: { lun_midi: 2 }, nettoyageSansViande: { lun_midi: 3 } }] });
    var n2 = col(C.feuilleJour(d2, d2.semaines[0], 'lun_midi'), 'nettoyage').c;
    egal([n2.total, n2.reg.sans_viande, n2.tex.normal], [5, 3, 5], 'Nettoyage 2 standard + 3 sans viande = 5, dont 3 sans viande');
    egal(col(f, 'direction').c.tex.normal, 3, 'Direction en texture normale');
    egal(col(f, 'totalParcs').c.reg.sans_viande, undefined, 'Nettoyage hors total parcs');
    egal(f.total.reg.sans_porc, 1 + 1, 'Sans porc = résident C + salarié parc (plus de sans porc Sodexo)');
    egal(C.feuilleJour(d, d.semaines[0], 'sam_midi').total.total, 5, 'Samedi : ni direction ni nettoyage');
  });

  groupe('Plats témoins', function () {
    var d = jeu(), s = d.semaines[0], f = C.feuilleJour(d, s, 'lun_midi');
    var t = col(f, 'temoins').c;
    egal([t.temoins, t.tex.normal, Object.keys(t.reg).length], [2, 2, 0], 'Témoins : texture normale, sans régime');
    egal(f.total.temoins, 2, 'Témoins repris dans le total à produire');
    egal(col(f, 'totalParcs').c.temoins, 0, 'Témoins hors total parcs');
    var t2 = f.total;
    egal((t2.tex.normal || 0) + (t2.tex.hache || 0) + (t2.tex.mixe || 0), t2.total, 'Normal + Haché + Mixé = total (avec témoins)');
    egal(C.feuilleJour(d, s, 'lun_soir').total.temoins, 0, 'Lundi soir : aucun témoin saisi');
    egal(M.semaineSuivante(s).temoins, { lun_midi: 2 }, 'Semaine suivante : reprend les plats témoins');
    egal(M.semaineSuivante({ debut: '2026-10-12', presences: { a: { sam_midi: 0, dim_soir: 0, lun_midi: 1 }, b: { lun_soir: 1 } } }).presences,
      { a: { sam_midi: 0, dim_soir: 0 } }, 'Semaine suivante : reprend les absences cochées (0), pas les « présent » saisis');
    var s43 = { debut: '2026-10-19' };
    egal(M.debutSemaineACreer(s43, '2026-10-24'), '2026-10-26', 'Semaine à créer : dernière S43, on est en S43 → S44');
    egal(M.debutSemaineACreer(s43, '2026-10-28'), '2026-11-02', 'Semaine à créer : dernière S43, on est en S44 → S45 (S44 sautée)');
    egal(M.debutSemaineACreer({ debut: '2026-11-02' }, '2026-10-24'), '2026-11-09', 'Semaine à créer : S45 déjà prête en avance → S46');
    egal(M.idSemaine(M.debutSemaineACreer({ debut: '2026-12-21' }, '2026-12-31')), '2027-S01', 'Semaine à créer : on est en S53 → 2027-S01');
    egal(M.semaineSuivante(s, '2026-11-02').id, '2026-S45', 'Semaine suivante à une date donnée : bon numéro');
  });

  groupe('Présences et alertes', function () {
    var d = jeu(), s = d.semaines[0], A = d.residents[0];
    A.absences.push({ debut: '2026-10-13', fin: '2026-10-14', services: ['midi'] });
    egal(C.presence(s, A, 'mar_midi'), { valeur: 0, source: 'absence' }, 'Absence de la fiche → 0');
    egal(C.presence(s, A, 'mar_soir').valeur, 1, 'Service non coché → présent');
    egal(C.presence(s, A, 'jeu_midi').valeur, 1, 'Hors période → présent');
    egal(C.alertes(d, s).length, 0, 'Aucune alerte au départ');
    s.presences.A = { mar_midi: 1 };
    var al = C.alertes(d, s);
    egal(al.map(function (a) { return a.type; }), ['presentAbsent'], 'Présent saisi pendant une absence → alerte');
    s.alertesTraitees.push({ cle: al[0].cle, statut: 'voulu' });
    egal(C.alertesVisibles(d, s).length, 0, '« C\'est voulu » masque l\'alerte');
    s.presences.A.mer_midi = 1;
    egal(C.alertesVisibles(d, s).length, 1, 'Nouvelle contradiction → l\'alerte revient');
    var Cr = d.residents[2];
    s.presences.C = {};
    M.creneaux(s).forEach(function (c) { s.presences.C[c] = 0; });
    egal(C.alertes(d, s).some(function (a) { return a.type === 'aucunePresence' && a.residentId === 'C'; }), true, 'Aucune présence sans absence → alerte');
    Cr.absences.push({ debut: '2026-10-01', fin: '2026-10-30', services: ['midi', 'soir'] });
    egal(C.alertes(d, s).some(function (a) { return a.type === 'aucunePresence'; }), false, 'Absence enregistrée → pas d\'alerte');
  });

  groupe('Petit déjeuner (présences seulement)', function () {
    var d = jeu(), s = d.semaines[0];
    s.salaries.p1.lun_petitdej = { standard: 1, sansPorc: 1 };
    s.temoins.lun_petitdej = 1;
    var f = C.feuilleJour(d, s, 'lun_petitdej'), p1 = col(f, 'p1').c;
    egal(f.presenceSeule, true, 'Service marqué « présence seulement »');
    egal([p1.residents, p1.platsEnPlus, p1.salStd, p1.salSansPorc, p1.total], [3, 0, 1, 1, 5], 'Parc 1 : 3 résidents (pas de double plat) + 2 salariés = 5');
    egal([p1.tex, p1.reg, p1.opt], [{}, {}, {}], 'Ni textures, ni régimes, ni options');
    egal(f.total.total, 3 + 2 + 1 + 1, 'Total à produire = 4 résidents + 2 salariés + 1 témoin');
    egal(C.feuilleJour(d, s, 'lun_midi').presenceSeule, false, 'Midi : comptage complet');
    var A = d.residents[0];
    A.absences.push({ debut: '2026-10-13', fin: '2026-10-13', services: ['petitdej'] });
    egal([C.presence(s, A, 'mar_petitdej').valeur, C.presence(s, A, 'mar_midi').valeur], [0, 1], 'Absence au petit déjeuner seulement');
    var ab = M.migrer({ app: M.APP, version: M.VERSION, residents: [{ id: 'X', absences: [
      { debut: '2026-10-12', fin: '2026-10-13', services: ['soir', 'midi', 'zzz'] },
      { debut: '2026-10-15', fin: '2026-10-15' }] }] });
    egal(ab.residents[0].absences.map(function (a) { return a.services; }), [['midi', 'soir'], ['petitdej', 'midi', 'soir']],
      'Absence : services rangés (inconnus retirés) ; aucun service = tous');
  });

  groupe('Services concernés par les régimes / options', function () {
    var d = jeu(), s = d.semaines[0], refs = M.refs(d);
    egal([refs.normal.services, refs.diabetique.services, refs.double_plat.services], [['midi', 'soir'], ['midi', 'soir'], ['midi', 'soir']],
      'Services concernés absents : midi et soir');
    var v = M.migrer({ app: M.APP, version: M.VERSION, referentiels: { regimes: [{ id: 'x', nature: 'regime', services: ['soir', 'petitdej', 'zzz'] }, { id: 'y', nature: 'regime', services: [] }] } });
    egal(v.referentiels.regimes.map(function (g) { return g.services; }), [['petitdej', 'soir'], []], 'Services conservés (ordre et valeurs nettoyés)');
    var effets = M.migrer({ app: M.APP, version: M.VERSION, referentiels: { regimes: ['plat', 'autre', ''].map(function (a, i) {
      return { id: 'o' + i, nature: 'option', affecte: a, services: ['midi'] }; }) } });
    egal(effets.referentiels.regimes.map(function (g) { return g.affecte; }), ['plat', '', ''], 'Effet inconnu → sur l’assiette');

    // Pots gourmands : alternative du petit déjeuner (option d'assiette), petit déjeuner seulement.
    d.referentiels.regimes.push({ id: 'pots', nom: 'Pots gourmands', nature: 'option', affecte: '', couleur: '#eee', services: ['petitdej'] });
    d.residents[0].optionIds.push('pots');
    var pd = C.feuilleJour(d, s, 'lun_petitdej'), mi = C.feuilleJour(d, s, 'lun_midi');
    egal([col(pd, 'p1').c.opt.pots, pd.total.opt.pots, mi.total.opt.pots], [1, 1, undefined], 'Pots gourmands comptés au petit déjeuner (par parc), pas à midi');
    egal(col(pd, 'p1').c.residents, 3, 'Le résident au pot gourmand reste compté dans les présents');
    egal(C.ventilation(d, pd.total, 'petitdej').filter(function (v) { return v.id === 'pots'; }).map(function (v) { return v.valeur; }), [1],
      'Pots gourmands dans « Sur ces N » du petit déjeuner');
    egal(C.particularites(d, 'lun_petitdej', col(pd, 'p1')).map(function (x) { return [x.regime.id, x.noms]; }), [['pots', ['A']]],
      'Chariot du petit déjeuner : pots gourmands, avec le nom');
    egal(C.chariot(d, s, 'lun_midi', col(mi, 'p1')).normauxSimples, 1, 'À midi, A reste un normal simple (pots non concernés)');

    // Diabétique décoché pour le soir.
    refs.diabetique.services = ['midi'];
    egal([C.feuilleJour(d, s, 'lun_midi').total.reg.diabetique, C.feuilleJour(d, s, 'lun_soir').total.reg.diabetique], [2, undefined],
      'Diabétique compté à midi (B, double plat = 2), pas le soir');
    var so = C.feuilleJour(d, s, 'lun_soir');
    egal(C.chariot(d, s, 'lun_soir', col(so, 'p1')).etiquettes[0].tags.map(function (g) { return g.id; }), ['double_plat', 'enrichi'],
      'Étiquette du soir sans la pastille diabétique');

    // Texture Haché décochée pour le soir : B compté en texture par défaut ; Normal + Haché + Mixé = total.
    refs.hache.services = ['midi'];
    so = C.feuilleJour(d, s, 'lun_soir');
    var t = so.total.tex;
    egal([t.normal, t.hache, t.mixe], [4, undefined, 1], 'Soir : B (haché, 2 plats) compté en normal');
    egal((t.normal || 0) + (t.hache || 0) + (t.mixe || 0), so.total.total, 'Somme des textures = total à produire');

    // Sans porc décoché pour midi : les salariés sans porc ne sont plus comptés dans le régime.
    refs.sans_porc.services = ['soir'];
    egal(C.feuilleJour(d, s, 'lun_midi').total.reg.sans_porc, undefined, 'Sans porc non concerné à midi : ni résidents ni salariés');

    // Double plat coché pour le petit déjeuner : pas de double (service « présence seulement »).
    refs.double_plat.services = ['petitdej', 'midi', 'soir'];
    egal(col(C.feuilleJour(d, s, 'lun_petitdej'), 'p1').c.platsEnPlus, 0, 'Petit déjeuner : jamais de double plat');
    egal(C.ventilation(d, C.feuilleJour(d, s, 'lun_soir').total, 'soir').map(function (v) { return v.id; }).indexOf('diabetique'), -1,
      'Ventilation du soir sans diabétique');
  });

  groupe('Feuille chariot', function () {
    var d = jeu(), f = C.feuilleJour(d, d.semaines[0], 'lun_midi');
    var ch = C.chariot(d, d.semaines[0], 'lun_midi', col(f, 'p1'));
    egal(ch.normauxSimples, 1, 'A = normal simple (collectif)');
    egal(ch.sansPorcSeuls, 1, 'C = sans porc seul (bac sans porc)');
    egal(ch.etiquettes.map(function (e) { return e.nom; }), ['B'], 'B a une étiquette');
    egal(ch.etiquettes[0].eq, 2, 'Étiquette de B : EQ 2');
    egal(ch.etiquettes[0].parc, null, 'Chariot de parc : pas de rappel du parc');
    egal(ch.doubles, [{ nom: 'B', n: 1 }], 'Double plat signalé');
    egal(ch.platsEnPlus, 1, 'Un plat chaud en plus');
    egal(ch.volume, 7, 'Volume du chariot = total du parc');
  });

  groupe('Normalisation des fichiers', function () {
    egal(M.VERSION, 1, 'Format de données : version 1 (application 1.0)');

  groupe('Annuler / rétablir les saisies (logique)', function () {
    var L = Recueil.Historique.logique, cases = { a: 1, b: undefined };
    function ch(cle, v) { return { lire: function () { return cases[cle]; }, ecrire: function (x) { cases[cle] = x; }, v: v }; }
    var liste = L.preparer([ch('a', 0), ch('b', undefined), ch('b', 5)]);
    egal(liste.map(function (x) { return [x.avant, x.apres]; }), [[1, 0], [undefined, 5]], 'Cases déjà à la bonne valeur ignorées');
    L.appliquer(liste, 'apres');
    egal([cases.a, cases.b], [0, 5], 'Rétablir / saisir : nouvelles valeurs');
    L.appliquer(liste, 'avant');
    egal([cases.a, cases.b], [1, undefined], 'Annuler : valeurs d’avant (pas de saisie = undefined)');
    cases = { a: 7 };
    var deux = [{ ecrire: function (x) { cases.a = x; }, avant: 7, apres: 0 }, { ecrire: function (x) { cases.a = x; }, avant: 7, apres: 3 }];
    L.appliquer(deux, 'apres'); L.appliquer(deux, 'avant');
    egal(cases.a, 7, 'Case changée deux fois dans une action : annuler retrouve la première valeur');
    var p = L.pile();
    p.ajouter('x'); p.ajouter('y');
    egal([p.annuler(), p.annuler(), p.annuler(), p.tailles()], ['y', 'x', undefined, [0, 2]], 'Annuler dans l’ordre inverse, rien de plus');
    egal([p.refaire(), p.tailles()], ['x', [1, 1]], 'Rétablir');
    p.ajouter('z');
    egal([p.refaire(), p.tailles()], [undefined, [2, 0]], 'Une nouvelle saisie efface ce qui pouvait être rétabli');
    for (var i = 0; i < 120; i++) p.ajouter(i);
    egal(p.tailles()[0], 100, 'Historique limité à 100 actions');
  });

    egal(types.filter(function (t) { return I.NOMS.indexOf(A.PAGES[t].illu) < 0; }), [], 'Chaque aide a une maquette connue');
    egal(types.filter(function (t) { var p = A.PAGES[t]; return !p.nom || !p.quoi || p.points.length < 3; }), [], 'Chaque aide : nom, résumé et au moins 3 points');
    egal(A.SLIDES.filter(function (s) { return I.NOMS.indexOf(s.illu) < 0 || !s.titre; }).length, 0, 'Présentation : titres et maquettes connus');
    egal(A.SLIDES.filter(function (s) { return [s.aller, s.aller2].some(function (a) { return a && !A.PAGES[a.page]; }); }).length, 0,
      'Présentation : les boutons « Aller à… » ouvrent des pages qui existent');
    egal(A.SLIDES.filter(function (s) { return typeof s.texte !== 'string' && !s.texte.vide; }).length, 0, 'Présentation : texte de base vide toujours présent');
    egal(A.lienGuide('parcs'), 'guide.html#parcs', 'Lien vers une section du guide');
    egal(/^\d+\.\d+/.test(M.VERSION_APP), true, 'Version de l’application : numéro ' + M.VERSION_APP);
    var n = I.texte('un **gras**\nligne 2');
    egal(n.length, 2, 'Texte d’aide : un retour à la ligne = 2 lignes');
    var div = document.createElement('div'); n.flat(2).forEach(function (x) { if (x) div.appendChild(x instanceof Node ? x : document.createTextNode(x)); });
    egal(div.querySelectorAll('strong').length + '/' + div.querySelectorAll('br').length, '1/1', 'Texte d’aide : **gras** et retour à la ligne');
  });

  groupe('Nouveautés', function () {
    var N = Recueil.Nouveautes, A = Recueil.Aide, V = N.VERSIONS;
    egal([N.comparer('1.0.1', '1.1') < 0, N.comparer('1.10', '1.9') > 0, N.comparer('1.1', '1.1.0')], [true, true, 0], 'Comparer des numéros de version');
    egal(V.some(function (v) { return v.version === M.VERSION_APP; }), true, 'La version ' + M.VERSION_APP + ' a son entrée dans les nouveautés');
    egal(V.filter(function (v, i) { return i && N.comparer(V[i - 1].version, v.version) <= 0; }).length, 0, 'Nouveautés : la plus récente d’abord, sans doublon');
    var points = [].concat.apply([], V.map(function (v) { return v.points; }));
    egal(V.filter(function (v) { return !/^\d{4}-\d\d-\d\d$/.test(v.date) || !v.points.length; }).length, 0, 'Chaque version : une date et au moins un point');
    egal(points.filter(function (p) { return !N.TYPES[p.type] || !p.texte; }).length, 0, 'Chaque point : un type connu et un texte');
    egal(points.filter(function (p) { return (p.page && !A.PAGES[p.page]) || (p.guide && A.SECTIONS.indexOf(p.guide) < 0); }).length, 0,
      'Boutons « Voir » et liens du guide valides');
    var essai = [{ version: '1.2', annoncer: true }, { version: '1.1.1', annoncer: false }, { version: '1.1', annoncer: true }, { version: '1.0', annoncer: false }];
    var garde = N.VERSIONS.splice(0, N.VERSIONS.length);
    N.VERSIONS.push.apply(N.VERSIONS, essai);
    egal(N.aAnnoncer('1.0', '1.1.1').map(function (v) { return v.version; }), ['1.1'], 'Annonce : version plus récente pas encore sortie ignorée');
    egal(N.aAnnoncer('1.0', '1.2').map(function (v) { return v.version; }), ['1.2', '1.1'], 'Annonce : versions sautées regroupées');
    egal(N.aAnnoncer('1.1', '1.1.1').length, 0, 'Annonce : simple correction, rien à annoncer');
    egal(N.publiees('1.1.1').length, 3, 'Historique : versions sorties seulement');
    N.VERSIONS.splice(0, N.VERSIONS.length);
    N.VERSIONS.push.apply(N.VERSIONS, garde);
  });

  var r = document.getElementById('resume');
  r.textContent = nbKo ? nbKo + ' test(s) en échec sur ' + (nbOk + nbKo) : 'Tous les tests passent (' + nbOk + ')';
  r.className = nbKo ? 'ko' : 'ok';
  document.title = (nbKo ? '✗ ' : '✓ ') + document.title;
})();
